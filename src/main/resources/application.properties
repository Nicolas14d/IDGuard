spring.application.name=idguardia-backend
server.port=8080

# Credenciales de base de datos Supabase (PostgreSQL)
spring.datasource.url=jdbc:postgresql://db.TU_PROYECTO.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=TU_PASSWORD_DE_SUPABASE
